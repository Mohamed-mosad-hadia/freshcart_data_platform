# =============================================================================
# Shared Airflow settings (anchor, not a container). Must stay above `services:`
# so the Airflow services at the bottom can reuse it.
#docker compose logs -f airflow-scheduler   # follow logs for one service
#docker compose restart airflow-worker      # restart one service
#docker compose stop                        # stop, keep data
#docker compose down                        # remove containers, keep data
#docker compose down -v                     # remove containers AND all data (full reset)
#docker compose --profile flower up -d      # also start Flower on :5555
#docker compose logs airflow-apiserver | grep -i password  # to grep the generated pa
# =============================================================================
x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

# =============================================================================
# FreshCart: THE COMPANY (its database, its business, its exchange-rate provider)
# Do not change these three services. Add YOUR data platform below them
# (warehouse, loaders, dbt, Airflow...): containers in this file can reach the
# company by name: source-db:5432, fx-api:8000.
# =============================================================================
services:
  # ---------------------------------------------------------------- the company's database
  source-db:
    image: postgres:16
    container_name: freshcart-source-db
    environment:
      POSTGRES_DB: freshcart_source
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      TZ: Africa/Cairo # show times in Cairo time
      PGTZ: Africa/Cairo
    ports:
      - "5433:5432"
    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./source_db/init:/docker-entrypoint-initdb.d:ro
    healthcheck: # "healthy" = ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_DB_USER} -d freshcart_source"]
      interval: 5s
      retries: 20

  # ---------------------------------------------------------------- keeps the company alive
  simulator:
    build: ./simulator
    container_name: freshcart-simulator
    environment:
      SOURCE_DB_HOST: source-db
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      COURSE_START_DATE: ${COURSE_START_DATE}
      COURSE_END_DATE: ${COURSE_END_DATE}
      HISTORY_DAYS: ${HISTORY_DAYS}
      ORDERS_PER_DAY: ${ORDERS_PER_DAY}
      N_CUSTOMERS: ${N_CUSTOMERS}
      N_PRODUCTS: ${N_PRODUCTS}
      SIM_SEED: ${SIM_SEED}
      SIM_FAKE_NOW: ${SIM_FAKE_NOW:-}
      SUPPLIER_DIR: /data/suppliers
      SOURCE_READER_PASSWORD: ${SOURCE_READER_PASSWORD} # creates the read-only account
    volumes:
      - ./source_files/suppliers:/data/suppliers # supplier files land in this project folder
    depends_on:
      source-db:
        condition: service_healthy # wait until the database is ready
    restart: unless-stopped # starts again automatically with Docker

  # ---------------------------------------------------------------- external exchange-rate provider
  fx-api:
    build: ./simulator # same image as the simulator (same FX formula)
    container_name: freshcart-fx-api
    command: ["fx-api"]
    environment:
      SIM_SEED: ${SIM_SEED}
      COURSE_START_DATE: ${COURSE_START_DATE}
      SIM_FAKE_NOW: ${SIM_FAKE_NOW:-}
      FX_API_KEY: ${FX_API_KEY}
    ports:
      - "8000:8000" # from your laptop: http://localhost:8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- YOUR PLATFORM STARTS HERE
  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native ClickHouse protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: freshcart_dwh
      CLICKHOUSE_USER: freshcart_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    restart: unless-stopped

  # ================================================================ AIRFLOW (bottom)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  source_db_data:
  clickhouse_data:
  postgres-db-volume:
